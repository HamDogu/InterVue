# Example ONLY: replace hostname/certificate paths; create htpasswd yourself.
# Never expose the trusted single-user service without access control.
server {
    listen 443 ssl;
    server_name interview.example.test;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    auth_basic "Private interview practice";
    auth_basic_user_file /etc/nginx/intervue.htpasswd;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Permissions-Policy "camera=(self), microphone=(self)" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
